name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      TRAVEL_PRODUCTION: '1'
      TRAVEL_AGENT_ENABLED: '0'
      LLM_INTENT_DISABLE_LLM: '1'
      AMAP_WEB_KEY: ''
      AMAP_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements.helloagents.txt -r backend/requirements.mcp.txt -c backend/requirements.travel.lock.txt
          python -m pip check
          npm ci
      - name: Verify development snapshot without live API keys
        run: python scripts/verify_repository.py
      - name: Verify generated API contract
        run: |
          python scripts/export_openapi.py
          npm run schema:generate
          git diff --exit-code -- packages/api-schema/openapi.json packages/api-schema/schema.d.ts
