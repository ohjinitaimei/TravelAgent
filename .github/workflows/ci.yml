name: Acceptance checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      TRAVEL_PRODUCTION: '1'
      TRAVEL_AGENT_ENABLED: '0'
      LLM_INTENT_DISABLE_LLM: '1'
      AMAP_WEB_KEY: ''
      AMAP_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements.helloagents.txt -r backend/requirements.mcp.txt -c backend/requirements.travel.lock.txt
          python -m pip check
          npm ci
      - name: Verify repository without live API keys
        run: python scripts/verify_repository.py
      - name: Verify generated API contract
        run: |
          python scripts/export_openapi.py
          npm run schema:generate
          git diff --exit-code -- packages/api-schema/openapi.json packages/api-schema/schema.d.ts
      - name: Install browser engines
        run: npx playwright install --with-deps --only-shell chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/playwright
      - name: Verify isolated browser interactions
        run: |
          python scripts/verify_browser.py --run-id ci
          python scripts/summarize_browser_runs.py --run-id ci
      - name: Verify source inventory
        run: python scripts/update_publish_manifest.py --check
      - name: Verify release packaging and isolated startup
        run: |
          python scripts/package_release.py build --output artifacts/releases/ci
          python scripts/package_release.py verify artifacts/releases/ci/TravelAgent.zip
          python scripts/verify_release_runtime.py artifacts/releases/ci/TravelAgent.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics-test-only
          path: |
            artifacts/browser-results
            artifacts/browser-diagnostics
            artifacts/browser-reports
            artifacts/browser-runs
