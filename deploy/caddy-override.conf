# Drop-in for the distribution's official caddy.service, not a second Caddy.
[Service]
EnvironmentFile=/etc/travelagent/gateway.env
ExecStart=
ExecStart=/usr/bin/caddy run --config /opt/travelagent/deploy/Caddyfile --adapter caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /opt/travelagent/deploy/Caddyfile --adapter caddyfile
